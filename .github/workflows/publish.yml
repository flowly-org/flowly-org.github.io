name: Publish to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html styles.css assets CNAME _site/
          touch _site/.nojekyll
          # Cache-busting: the CDN keeps styles.css for hours; a new page must load its own stylesheet.
          v=$(sha256sum styles.css | cut -c1-10)
          sed -i "s|href=\"styles.css\"|href=\"styles.css?v=$v\"|" _site/index.html
          grep -q "styles.css?v=$v" _site/index.html
      - name: Push to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _site
          cname: flowly.net
          force_orphan: true
          commit_message: "Publish ${{ github.sha }}"
